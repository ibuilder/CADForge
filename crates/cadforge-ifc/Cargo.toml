[package]
name = "cadforge-ifc"
description = "CADForge IFC boundary: the IfcBackend trait and schema detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# ADR-0003: the IFC library sits behind a trait and is swappable. No third-party IFC type
# may reach cadforge-core. `ifc-lite` is the intended default, pending measurement against
# the Phase 2 corpus (PLAN.md §10).
[features]
default = ["read"]
# The read backend. Off by default only for a build that exports and never imports.
read = ["dep:ifc-lite-core"]

[dependencies]
cadforge-core.workspace = true
glam.workspace = true
serde.workspace = true
thiserror.workspace = true
ifc-lite-core = { workspace = true, optional = true }

[dev-dependencies]
ifc-lite-core.workspace = true

[[example]]
name = "ifclite_spike"

[[example]]
name = "corpus_survey"

[[example]]
name = "corpus_import"
