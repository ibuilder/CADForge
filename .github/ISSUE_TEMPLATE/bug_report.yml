name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue — a file that crashes the parser, an unbounded
        allocation, anything that escapes the geometry pipeline — please report it privately
        instead. See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        Commands, code, or an IFC file. A file that reproduces the problem is worth more
        than a paragraph describing one — attach it if you can share it.
      placeholder: |
        1. cargo run -p cadforge-shell
        2. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - cadforge-core (elements, commands, undo)
        - cadforge-geom (profiles, sweeps, booleans)
        - cadforge-family (parameters, recipes, hosting)
        - cadforge-ifc (export, schema)
        - cadforge-render (camera, culling, GPU)
        - Build, CI, or docs
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0, or a commit SHA
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows 11, rustc 1.98.0, AMD Radeon / Vulkan
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Error text, a stack trace, or the failing test. Automatically formatted.
      render: shell
