        d="M10 50 L26 36 L116 36 L116 56 L80 56 L80 82 L100 82 L100 104 L28 104 L28 82 L48 82 L48 56 L26 56 Z"/>
  <path fill="#e2954f" d="M26 36 L116 36 L116 44 L26 44 Z"/>
</svg>
